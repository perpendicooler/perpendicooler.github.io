<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The Rubik’s Cube as a finite group">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102843"/><stop offset="1" stop-color="#0a1325"/></linearGradient>
    <filter id="shade"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="62" y="76" fill="#edf5fb" font-size="36" font-weight="700" font-family="Arial,sans-serif">The Rubik’s Cube as a finite group</text>
  <text x="62" y="112" fill="#abc2d4" font-size="19" font-family="Arial,sans-serif">Piece permutations × orientation constraints × parity</text>
  <path d="M62 133 H1138" stroke="#284762" stroke-width="2"/>
<rect x="62" y="168" width="305" height="340" rx="22" fill="#152640" filter="url(#shade)"/><text x="214" y="216" fill="#ffca78" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" font-weight="700">8 CORNERS</text><text x="214" y="254" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="400">8! permutations</text><text x="214" y="287" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="400">3⁷ legal twists</text><path d="M105 309 H324" fill="none" stroke="#45637c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="214" y="349" fill="#abc2d4" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="400">Final twist is forced</text><text x="214" y="383" fill="#ffca78" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="400">(sum ≡ 0 mod 3)</text><polygon points="173,420 214,400 255,420 214,441" fill="#ffca78"/><polygon points="173,420 214,441 214,485 173,463" fill="#d39648"/><polygon points="255,420 214,441 214,485 255,463" fill="#edb574"/><rect x="447" y="168" width="305" height="340" rx="22" fill="#152640" filter="url(#shade)"/><text x="600" y="216" fill="#65d5d3" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" font-weight="700">12 EDGES</text><text x="600" y="254" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="400">12! permutations</text><text x="600" y="287" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="400">2¹¹ legal flips</text><path d="M491 309 H709" fill="none" stroke="#45637c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="349" fill="#abc2d4" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="400">Final flip is forced</text><text x="600" y="383" fill="#65d5d3" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="400">(sum ≡ 0 mod 2)</text><rect x="548" y="414" width="104" height="65" rx="9" fill="#65d5d3"/><path d="M600 414 V479" stroke="#d2fdff" stroke-width="4"/><rect x="600" y="414" width="52" height="65" rx="8" fill="#2e87b0"/><rect x="833" y="168" width="305" height="340" rx="22" fill="#152640" filter="url(#shade)"/><text x="986" y="216" fill="#baaeff" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" font-weight="700">PARITY</text><text x="986" y="253" fill="#edf5fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Corner and edge</text><text x="986" y="286" fill="#edf5fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="400">permutations match</text><path d="M876 309 H1094" fill="none" stroke="#45637c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="986" y="350" fill="#abc2d4" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="400">Compatible pairs</text><text x="986" y="388" fill="#baaeff" font-family="Arial,sans-serif" font-size="49" text-anchor="middle" font-weight="700">1 / 2</text><text x="600" y="572" fill="#edf5fb" font-family="Arial,sans-serif" font-size="27" text-anchor="middle" font-weight="700">8! × 3⁷ × 12! × 2¹¹ / 2  =  43,252,003,274,489,856,000</text></svg>