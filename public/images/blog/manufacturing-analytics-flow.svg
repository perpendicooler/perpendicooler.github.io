 cx="965" cy="428" r="5" fill="#97e3b6"/><text x="982" y="435" fill="#edf5fb" font-family="Arial,sans-serif" font-size="19" text-anchor="start" font-weight="400">Realized outcomes</text><text x="600" y="566" fill="#edf5fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="700">Capacity constraints   •   Forecast uncertainty   •   Financial trade-offs</text><text x="600" y="601" fill="#abc2d4" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400">Use transparent assumptions and validate each scenario with domain experts.</text></svg>