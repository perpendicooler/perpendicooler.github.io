<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Alpha–beta pruning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102843"/><stop offset="1" stop-color="#0a1325"/></linearGradient>
    <filter id="shade"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="62" y="76" fill="#edf5fb" font-size="36" font-weight="700" font-family="Arial,sans-serif">Alpha–beta pruning</text>
  <text x="62" y="112" fill="#abc2d4" font-size="19" font-family="Arial,sans-serif">Exact search can skip choices that cannot improve the best known alternative</text>
  <path d="M62 133 H1138" stroke="#284762" stroke-width="2"/>
<rect x="68" y="161" width="1064" height="402" rx="22" fill="#152640" filter="url(#shade)"/><circle cx="595" cy="217" r="52" fill="#1e4f70" stroke="#65d5d3" stroke-width="3"/><text x="595" y="216" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700">MAX</text><text x="595" y="241" fill="#65d5d3" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="400">α = 3</text><path d="M555 254 L324 333" fill="none" stroke="#7f9bb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M635 254 L873 333" fill="none" stroke="#7f9bb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="373" r="49" fill="#23354d" stroke="#ffca78" stroke-width="3"/><text x="320" y="370" fill="#edf5fb" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="700">A / MIN</text><circle cx="874" cy="373" r="49" fill="#23354d" stroke="#baaeff" stroke-width="3"/><text x="874" y="370" fill="#edf5fb" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="700">B / MIN</text><text x="320" y="393" fill="#ffca78" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="400">value = 3</text><text x="874" y="393" fill="#baaeff" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="400">β ≤ 2</text><path d="M320 422 L240 473" fill="none" stroke="#728da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 422 L404 473" fill="none" stroke="#728da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M874 422 L800 473" fill="none" stroke="#728da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M874 422 L958 473" fill="none" stroke="#728da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><rect x="202" y="465" rx="10" width="76" height="50" fill="#304964" stroke="#ffca78" stroke-width="2"/><text x="240" y="497" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="400">3</text><rect x="366" y="465" rx="10" width="76" height="50" fill="#304964" stroke="#ffca78" stroke-width="2"/><text x="404" y="497" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="400">5</text><rect x="762" y="465" rx="10" width="76" height="50" fill="#304964" stroke="#baaeff" stroke-width="2"/><text x="800" y="497" fill="#edf5fb" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="400">2</text><rect x="912" y="465" rx="10" width="110" height="50" fill="#273249" stroke="#ef858a" stroke-width="2" stroke-dasharray="6 5"/><text x="967" y="497" fill="#ef858a" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700">PRUNE</text><text x="595" y="546" fill="#abc2d4" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400">Example utility scale: A guarantees 3; B can provide at most 2.</text><text x="595" y="607" fill="#edf5fb" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="400">When α ≥ β, the remaining children of B cannot change MAX’s choice.</text></svg>