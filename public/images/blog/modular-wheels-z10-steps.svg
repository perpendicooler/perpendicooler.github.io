<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="605" viewBox="0 0 1200 605" role="img" aria-label="ONE MODULUS, DIFFERENT JOURNEYS  •  Z10"><rect width="1200" height="605" rx="18" fill="#1f2022"/><text x="38" y="50" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#f3f3f3" text-anchor="start">ONE MODULUS, DIFFERENT JOURNEYS  •  Z10</text><text x="38" y="81" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#b4b9bd" text-anchor="start">Each arrow means: add the selected step, then reduce modulo n.</text><rect x="20" y="108" width="575" height="466" rx="14" fill="#26282b" stroke="#44474b"/><text x="44" y="150" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#f3f3f3" text-anchor="start">Z10   •   add 1</text><text x="44" y="181" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#b4b9bd" text-anchor="start">gcd(1, 10) = 1</text><text x="307" y="548" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#54bbeb" text-anchor="middle">1 cycle   ×   10 steps each</text><rect x="615" y="108" width="575" height="466" rx="14" fill="#26282b" stroke="#44474b"/><text x="639" y="150" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#f3f3f3" text-anchor="start">Z10   •   add 4</text><text x="639" y="181" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#b4b9bd" text-anchor="start">gcd(4, 10) = 2</text><text x="902" y="548" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#54bbeb" text-anchor="middle">2 cycles   ×   5 steps each</text><defs><marker id="z10-steps-0-arrow-0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.1" markerHeight="4.1" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54bbeb"/></marker><marker id="z10-steps-1-arrow-0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.1" markerHeight="4