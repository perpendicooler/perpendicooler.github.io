<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Animated square symmetry rotation and equivalent tic tac toe patterns">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#152735"/><stop offset="1" stop-color="#0d1824"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#2a97a5" stop-opacity=".19"/><stop offset="1" stop-color="#2a97a5" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#52788a" opacity=".33"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .caption{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#95c9de}
    .sub{font:500 12px Arial,sans-serif;fill:#9fb7c4}
    .cell{fill:#182f3e;stroke:#42647a;stroke-width:1.5}
    .cyan{stroke:#51d6f5;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .mint{stroke:#79e3b1;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .orange{stroke:#ffca79;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .flowline{stroke-dasharray:8 12;animation:flowline 1.8s linear infinite}
    @keyframes flowline{to{stroke-dashoffset:-40}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes pop{0%,12%{opacity:0;transform:scale(.7)}25%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
    @keyframes rotateSymbol{to{transform:rotate(360deg)}}
    @keyframes glowline{0%,100%{opacity:.22}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-50}}
    @keyframes pulseMark{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes turnCube{0%,100%{transform:translateY(3px) rotate(-2deg)}50%{transform:translateY(-10px) rotate(4deg)}}
    
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
  <rect x="1" y="1" width="638" height="358" rx="16" fill="url(#bg)" stroke="#294355" stroke-width="2"/>
  <circle cx="475" cy="150" r="225" fill="url(#halo)"/>
  <rect x="16" y="16" width="608" height="328" rx="12" fill="url(#dots)"/>
  <text x="30" y="40" class="caption">SYMMETRY  /  BURNSIDE LEMMA</text><text x="30" y="65" class="sub">Rotations, reflections and equivalent states</text><path d="M134 125V245 M94 165H214" stroke="#66899a" stroke-width="3" stroke-linecap="round"/><path d="M174 125V245 M94 205H214" stroke="#66899a" stroke-width="3" stroke-linecap="round"/><circle cx="114" cy="145" r="12" fill="#51d6f5"/><circle cx="154" cy="145" r="12" fill="#79e3b1"/><circle cx="194" cy="185" r="12" fill="#ffca79"/><circle cx="114" cy="225" r="12" fill="#b6a1fb"/><path d="M467 125V245 M427 165H547" stroke="#66899a" stroke-width="3" stroke-linecap="round"/><path d="M507 125V245 M427 205H547" stroke="#66899a" stroke-width="3" stroke-linecap="round"/><circle cx="527" cy="145" r="12" fill="#51d6f5"/><circle cx="527" cy="185" r="12" fill="#79e3b1"/><circle cx="487" cy="225" r="12" fill="#ffca79"/><circle cx="447" cy="145" r="12" fill="#b6a1fb"/><circle cx="321" cy="181" r="40" fill="#163b4d" stroke="#51d6f5" stroke-width="2"/>
<g style="transform-origin:321px 181px;animation:rotateSymbol 9s linear infinite"><path d="M301 156a31 31 0 1 1-15 40" fill="none" stroke="#79e3b1" stroke-width="6" stroke-linecap="round"/><path d="m278 194 9 10 10-8" fill="none" stroke="#79e3b1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="154" y="283" text-anchor="middle" font-family="Arial" font-size="13" fill="#afcad4">ORIGINAL</text>
<text x="485" y="283" text-anchor="middle" font-family="Arial" font-size="13" fill="#afcad4">ROTATED</text>
</svg>