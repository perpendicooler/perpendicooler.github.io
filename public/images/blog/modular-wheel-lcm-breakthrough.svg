<text x="181.60" y="224.32" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#f3f3f3" text-anchor="middle">9</text><text x="278" y="540" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#54bbeb" text-anchor="middle">0 → 4 → 8 → 2 → 6 → 0</text><text x="573" y="153" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#f3f3f3" text-anchor="start">THE FIRST COMMON MULTIPLE</text><text x="573" y="182" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#b4b9bd" text-anchor="start">Each jump adds 4; we track both total and residue.</text><text x="608" y="224" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#b4b9bd" text-anchor="start">Jump</text><text x="779" y="224" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#b4b9bd" text-anchor="start">Total</text><text x="980" y="224" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#b4b9bd" text-anchor="start">Residue mod 10</text><text x="608" y="266" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#f3f3f3" text-anchor="start">0</text><text x="779" y="266" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#f3f3f3" text-anchor="start">0</text><text x="980" y="266" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#f3f3f3" text-anchor="start">0</text><text x="608" y="312" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#f3f3f3" text-anchor="start">1</text><text x="779" y="312" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#f3f3f3" text-anchor="start">4</text><text x="980" y="312" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#f3f3f3" text-anchor="start">4</text><text x="608" y="358" font-family="Arial,Helvetica,sans-serif" font-size